<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Cadastro • Cyber-Nexis V9.2.1
  </title>

  <meta
    name="description"
    content="Criação de identidade Cyber-Nexis."
  >


  <!-- ========================================================
       PARTICLES.JS
  ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"
    defer
  ></script>

  <script
    src="particles-config.js"
    defer
  ></script>


  <style>

    /* ========================================================
       CYBER-NEXIS REGISTER V9.2.1
    ======================================================== */

    :root {
      --bg: #000;

      --panel:
        rgba(
          0,
          8,
          14,
          .92
        );

      --panel-2:
        rgba(
          0,
          2,
          5,
          .97
        );

      --accent:
        #18b8ff;

      --accent-2:
        #53d8ff;

      --accent-dark:
        #075277;

      --text-high:
        #eef9ff;

      --text-medium:
        #adc5d2;

      --text-low:
        #718b99;

      --ok:
        #5fe6bc;

      --danger:
        #ff6f86;

      --radius:
        20px;
    }


    /* ========================================================
       RESET
    ======================================================== */

    * {
      box-sizing:
        border-box;
    }


    html {
      min-height:
        100%;
    }


    body {
      margin:
        0;

      min-height:
        100vh;

      display:
        grid;

      place-items:
        center;

      padding:
        24px;

      color:
        var(
          --text-high
        );

      background:
        #000;

      font-family:
        "Segoe UI",
        "Courier New",
        monospace;

      overflow-x:
        hidden;
    }


    /* ========================================================
       GRADE DE FUNDO
    ======================================================== */

    body::before {
      content:
        "";

      position:
        fixed;

      inset:
        0;

      pointer-events:
        none;

      background:
        linear-gradient(
          rgba(
            50,
            196,
            255,
            .015
          )
          1px,
          transparent
          1px
        ),

        linear-gradient(
          90deg,
          rgba(
            50,
            196,
            255,
            .015
          )
          1px,
          transparent
          1px
        );

      background-size:
        42px
        42px;

      z-index:
        0;
    }


    /* ========================================================
       PARTÍCULAS
    ======================================================== */

    #particles-js {
      position:
        fixed;

      inset:
        0;

      z-index:
        0;

      pointer-events:
        none;
    }


    /* ========================================================
       CONTAINER
    ======================================================== */

    .auth-shell {
      position:
        relative;

      z-index:
        2;

      width:
        min(
          100%,
          460px
        );
    }


    /* ========================================================
       CARD
    ======================================================== */

    .auth-card {
      position:
        relative;

      padding:
        clamp(
          26px,
          6vw,
          42px
        );

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .30
        );

      border-radius:
        var(
          --radius
        );

      background:
        linear-gradient(
          145deg,
          var(
            --panel
          ),
          var(
            --panel-2
          )
        );

      box-shadow:
        0
        30px
        80px
        rgba(
          0,
          0,
          0,
          .75
        ),

        0
        0
        36px
        rgba(
          24,
          184,
          255,
          .10
        ),

        inset
        0
        0
        32px
        rgba(
          24,
          184,
          255,
          .025
        );

      overflow:
        hidden;
    }


    /* ========================================================
       EFEITO SCAN
    ======================================================== */

    .auth-card::before {
      content:
        "";

      position:
        absolute;

      inset:
        0;

      pointer-events:
        none;

      background:
        linear-gradient(
          110deg,
          transparent
          20%,

          rgba(
            83,
            216,
            255,
            .07
          ),

          transparent
          60%
        );

      transform:
        translateX(
          -110%
        );

      animation:
        scan
        6s
        linear
        infinite;
    }


    @keyframes scan {

      0% {
        transform:
          translateX(
            -110%
          );
      }

      55%,
      100% {
        transform:
          translateX(
            110%
          );
      }

    }


    /* ========================================================
       KICKER
    ======================================================== */

    .auth-kicker {
      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

      margin-bottom:
        14px;

      color:
        var(
          --accent-2
        );

      font-size:
        .72rem;

      font-weight:
        900;

      letter-spacing:
        2px;

      text-transform:
        uppercase;
    }


    .auth-kicker::before {
      content:
        "";

      width:
        8px;

      height:
        8px;

      border-radius:
        50%;

      background:
        var(
          --accent
        );

      box-shadow:
        0
        0
        16px
        var(
          --accent
        );
    }


    /* ========================================================
       TÍTULO
    ======================================================== */

    h1 {
      margin:
        0;

      color:
        #fff;

      font-size:
        clamp(
          2rem,
          8vw,
          3rem
        );

      line-height:
        1;

      text-transform:
        uppercase;

      text-shadow:
        0
        0
        22px
        rgba(
          24,
          184,
          255,
          .25
        );
    }


    .subtitle {
      margin:
        14px
        0
        26px;

      color:
        var(
          --text-medium
        );

      line-height:
        1.7;
    }


    /* ========================================================
       FORM
    ======================================================== */

    form {
      display:
        grid;

      gap:
        14px;
    }


    label {
      display:
        block;

      margin-bottom:
        7px;

      color:
        var(
          --text-low
        );

      font-size:
        .76rem;

      font-weight:
        900;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;
    }


    .input-wrap {
      position:
        relative;
    }


    input {
      width:
        100%;

      min-height:
        48px;

      padding:
        13px
        14px;

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .27
        );

      border-radius:
        12px;

      background:
        rgba(
          0,
          0,
          0,
          .72
        );

      color:
        #fff;

      font:
        inherit;

      outline:
        0;

      transition:
        .2s
        ease;
    }


    input:focus {
      border-color:
        var(
          --accent-2
        );

      box-shadow:
        0
        0
        0
        3px
        rgba(
          24,
          184,
          255,
          .09
        );
    }


    /* ========================================================
       SENHA
    ======================================================== */

    .password-field input {
      padding-right:
        54px;
    }


    .toggle-password {
      position:
        absolute;

      top:
        50%;

      right:
        7px;

      transform:
        translateY(
          -50%
        );

      width:
        38px;

      height:
        38px;

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .15
        );

      border-radius:
        9px;

      background:
        rgba(
          24,
          184,
          255,
          .05
        );

      color:
        var(
          --accent-2
        );

      cursor:
        pointer;
    }


    /* ========================================================
       AÇÕES
    ======================================================== */

    .actions {
      display:
        grid;

      gap:
        10px;

      margin-top:
        4px;
    }


    button,
    .secondary-link {
      min-height:
        46px;

      width:
        100%;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        10px;

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .34
        );

      font:
        inherit;

      font-weight:
        900;

      letter-spacing:
        .8px;

      text-decoration:
        none;

      cursor:
        pointer;

      transition:
        .2s
        ease;
    }


    /* ========================================================
       BOTÃO PRINCIPAL
    ======================================================== */

    .primary {
      color:
        #effbff;

      background:
        linear-gradient(
          135deg,
          #128dc5,
          #075277
        );

      box-shadow:
        0
        0
        18px
        rgba(
          24,
          184,
          255,
          .15
        );
    }


    .primary:hover:not(:disabled) {
      transform:
        translateY(
          -1px
        );

      box-shadow:
        0
        0
        26px
        rgba(
          24,
          184,
          255,
          .25
        );
    }


    /* ========================================================
       LINK SECUNDÁRIO
    ======================================================== */

    .secondary-link {
      color:
        #8bdfff;

      background:
        rgba(
          24,
          184,
          255,
          .045
        );
    }


    button:disabled {
      opacity:
        .58;

      cursor:
        wait;
    }


    /* ========================================================
       FEEDBACK
    ======================================================== */

    .feedback {
      min-height:
        24px;

      margin:
        4px
        0
        0;

      color:
        var(
          --danger
        );

      font-size:
        .88rem;

      line-height:
        1.5;

      text-align:
        center;
    }


    .feedback.ok {
      color:
        var(
          --ok
        );
    }


    /* ========================================================
       NOTA DO SISTEMA
    ======================================================== */

    .system-note {
      margin-top:
        20px;

      padding-top:
        16px;

      border-top:
        1px solid
        rgba(
          24,
          184,
          255,
          .12
        );

      color:
        var(
          --text-low
        );

      font-size:
        .75rem;

      line-height:
        1.65;

      text-align:
        center;
    }


    .system-note strong {
      color:
        var(
          --accent-2
        );
    }


    /* ========================================================
       FOCO
    ======================================================== */

    :focus-visible {
      outline:
        2px solid
        var(
          --accent-2
        );

      outline-offset:
        3px;
    }


    /* ========================================================
       RESPONSIVO
    ======================================================== */

    @media (
      max-width:
      500px
    ) {

      body {
        padding:
          14px;
      }


      .auth-card {
        padding:
          24px
          18px;

        border-radius:
          15px;
      }

    }


    /* ========================================================
       ACESSIBILIDADE
    ======================================================== */

    @media (
      prefers-reduced-motion:
      reduce
    ) {

      *,
      *::before,
      *::after {
        animation:
          none !important;

        transition:
          none !important;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================================
       PARTÍCULAS
  ========================================================= -->

  <div
    id="particles-js"
    aria-hidden="true"
  ></div>


  <!-- ========================================================
       CADASTRO
  ========================================================= -->

  <main class="auth-shell">

    <section
      class="auth-card"
      aria-labelledby="register-title"
    >

      <span class="auth-kicker">
        Cyber-Nexis // Enrollment V9.2.1
      </span>


      <h1 id="register-title">
        Criar Conta
      </h1>


      <p class="subtitle">

        A identidade nasce como

        <strong>
          Observador N0
        </strong>

        e só poderá fazer login
        depois que o endereço de
        e-mail for confirmado.

      </p>


      <!-- ====================================================
           FORMULÁRIO
      ===================================================== -->

      <form
        id="registerForm"
        autocomplete="on"
      >


        <!-- EMAIL -->

        <div>

          <label for="email">
            Email operacional
          </label>


          <div class="input-wrap">

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="operador@email.com"
              required
            >

          </div>

        </div>


        <!-- SENHA -->

        <div>

          <label for="senha">
            Senha
          </label>


          <div
            class="
              input-wrap
              password-field
            "
          >

            <input
              id="senha"
              name="senha"
              type="password"
              autocomplete="new-password"
              minlength="6"
              placeholder="mínimo 6 caracteres"
              required
            >


            <button
              class="toggle-password"
              type="button"
              aria-label="Mostrar senhas"
            >
              ◉
            </button>

          </div>

        </div>


        <!-- CONFIRMAÇÃO -->

        <div>

          <label for="confirmarSenha">
            Confirmar senha
          </label>


          <div class="input-wrap">

            <input
              id="confirmarSenha"
              name="confirmarSenha"
              type="password"
              autocomplete="new-password"
              minlength="6"
              placeholder="repita a senha"
              required
            >

          </div>

        </div>


        <!-- AÇÕES -->

        <div class="actions">

          <button
            id="btnRegister"
            class="primary"
            type="submit"
          >
            Registrar
          </button>


          <a
            class="secondary-link"
            href="login.html"
          >
            Voltar ao login
          </a>

        </div>


        <!-- FEEDBACK -->

        <p
          id="feedback"
          class="feedback"
          aria-live="polite"
        ></p>


      </form>


      <!-- ====================================================
           NOTA
      ===================================================== -->

      <p class="system-note">

        <strong>
          Nascimento da identidade:
        </strong>

        Observador N0
        ·
        0 XP
        ·
        0 créditos
        ·
        status pendente.

      </p>


    </section>

  </main>


  <!-- ========================================================
       JAVASCRIPT
  ========================================================= -->

  <script type="module">

    import {
      getCurrentUser,
      register
    } from "./site.js";


    /* ========================================================
       ELEMENTOS
    ======================================================== */

    const form =
      document.getElementById(
        "registerForm"
      );


    const btnRegister =
      document.getElementById(
        "btnRegister"
      );


    const feedback =
      document.getElementById(
        "feedback"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const senhaInput =
      document.getElementById(
        "senha"
      );


    const confirmInput =
      document.getElementById(
        "confirmarSenha"
      );


    const togglePassword =
      document.querySelector(
        ".toggle-password"
      );


    /* ========================================================
       FEEDBACK
    ======================================================== */

    function setFeedback(
      message,
      type = "error"
    ) {

      feedback.textContent =
        message || "";


      feedback.classList.toggle(
        "ok",
        type === "ok"
      );

    }


    /* ========================================================
       LOADING
    ======================================================== */

    function setLoading(
      value
    ) {

      btnRegister.disabled =
        value;


      btnRegister.textContent =
        value
          ? "Criando..."
          : "Registrar";

    }


    /* ========================================================
       TRADUÇÃO DE ERROS
    ======================================================== */

    function translateError(
      error
    ) {

      const code =
        error?.code || "";


      const messages = {

        "auth/email-already-in-use":
          "Este e-mail já está cadastrado.",


        "auth/invalid-email":
          "E-mail inválido.",


        "auth/weak-password":
          "A senha precisa ter pelo menos 6 caracteres.",


        "auth/operation-not-allowed":
          "Ative o provedor Email/Senha no Firebase Authentication.",


        "auth/network-request-failed":
          "Falha de conexão.",


        "profile/save-failed":
          "O Authentication criou a conta, mas o perfil não passou pelas Security Rules.",


        "app/firebase-config-missing":
          "firebase-config.js não está configurado."

      };


      return (
        messages[code] ||
        error?.message ||
        "Não foi possível criar a conta."
      );

    }


    /* ========================================================
       MOSTRAR / OCULTAR SENHAS
    ======================================================== */

    togglePassword.addEventListener(
      "click",

      () => {

        const show =
          senhaInput.type ===
          "password";


        senhaInput.type =
          show
            ? "text"
            : "password";


        confirmInput.type =
          show
            ? "text"
            : "password";


        togglePassword.textContent =
          show
            ? "◎"
            : "◉";


        togglePassword.setAttribute(
          "aria-label",

          show
            ? "Ocultar senhas"
            : "Mostrar senhas"
        );

      }
    );


    /* ========================================================
       CADASTRO
    ======================================================== */

    form.addEventListener(
      "submit",

      async (
        event
      ) => {

        event.preventDefault();


        const email =
          emailInput.value.trim();


        const password =
          senhaInput.value;


        const confirmation =
          confirmInput.value;


        /* ----------------------------------------------------
           CAMPOS OBRIGATÓRIOS
        ---------------------------------------------------- */

        if (
          !email ||
          !password ||
          !confirmation
        ) {

          setFeedback(
            "Preencha todos os campos."
          );

          return;
        }


        /* ----------------------------------------------------
           TAMANHO DA SENHA
        ---------------------------------------------------- */

        if (
          password.length < 6
        ) {

          setFeedback(
            "A senha precisa ter pelo menos 6 caracteres."
          );

          return;
        }


        /* ----------------------------------------------------
           SENHAS DIFERENTES
        ---------------------------------------------------- */

        if (
          password !==
          confirmation
        ) {

          setFeedback(
            "As senhas não coincidem."
          );

          return;
        }


        try {

          setLoading(
            true
          );


          setFeedback(
            "Criando identidade Observador N0...",
            "ok"
          );


          /* --------------------------------------------------
             CRIA CONTA
          -------------------------------------------------- */

          await register(
            email,
            password
          );


          /* --------------------------------------------------
             SUCESSO
          -------------------------------------------------- */

          setFeedback(
            "Conta criada. Verificação enviada. Indo para o login...",
            "ok"
          );


          /* --------------------------------------------------
             REDIRECT PARA LOGIN
          -------------------------------------------------- */

          window.setTimeout(

            () => {

              window.location.replace(
                "login.html?registered=1"
              );

            },

            900

          );


        } catch (
          error
        ) {

          console.error(
            "Erro no cadastro:",
            error
          );


          setFeedback(
            translateError(
              error
            )
          );


          setLoading(
            false
          );

        }

      }
    );


    /* ========================================================
       USUÁRIO JÁ AUTENTICADO
    ======================================================== */

    getCurrentUser(

      (
        user
      ) => {

        if (
          user
        ) {

          window.location.replace(
            "Index.html"
          );

        }

      }

    );

  </script>

</body>

</html>
