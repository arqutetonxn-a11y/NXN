<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Acesso Restrito • Cyber-Nexis V9.2.1
  </title>

  <meta
    name="description"
    content="Gateway de autenticação da Cyber-Nexis."
  >


  <!-- ========================================================
       PARTICLES.JS
  ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"
    defer
  ></script>

  <script
    src="particles-config.js"
    defer
  ></script>


  <style>

    /* ========================================================
       CYBER-NEXIS LOGIN V9.2.1
    ======================================================== */

    :root {
      --bg: #000;

      --panel:
        rgba(
          0,
          8,
          14,
          .92
        );

      --panel-2:
        rgba(
          0,
          2,
          5,
          .97
        );

      --accent:
        #18b8ff;

      --accent-2:
        #53d8ff;

      --accent-dark:
        #075277;

      --text-high:
        #eef9ff;

      --text-medium:
        #adc5d2;

      --text-low:
        #718b99;

      --ok:
        #5fe6bc;

      --danger:
        #ff6f86;

      --radius:
        20px;
    }


    /* ========================================================
       RESET
    ======================================================== */

    * {
      box-sizing:
        border-box;
    }


    html {
      min-height:
        100%;
    }


    body {
      margin:
        0;

      min-height:
        100vh;

      display:
        grid;

      place-items:
        center;

      padding:
        24px;

      color:
        var(
          --text-high
        );

      background:
        #000;

      font-family:
        "Segoe UI",
        "Courier New",
        monospace;

      overflow-x:
        hidden;
    }


    /* ========================================================
       GRADE DE FUNDO
    ======================================================== */

    body::before {
      content:
        "";

      position:
        fixed;

      inset:
        0;

      pointer-events:
        none;

      background:
        linear-gradient(
          rgba(
            50,
            196,
            255,
            .015
          )
          1px,
          transparent
          1px
        ),

        linear-gradient(
          90deg,
          rgba(
            50,
            196,
            255,
            .015
          )
          1px,
          transparent
          1px
        );

      background-size:
        42px
        42px;

      z-index:
        0;
    }


    /* ========================================================
       PARTÍCULAS
    ======================================================== */

    #particles-js {
      position:
        fixed;

      inset:
        0;

      z-index:
        0;

      pointer-events:
        none;
    }


    /* ========================================================
       CONTAINER
    ======================================================== */

    .auth-shell {
      position:
        relative;

      z-index:
        2;

      width:
        min(
          100%,
          460px
        );
    }


    /* ========================================================
       CARD
    ======================================================== */

    .auth-card {
      position:
        relative;

      padding:
        clamp(
          26px,
          6vw,
          42px
        );

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .30
        );

      border-radius:
        var(
          --radius
        );

      background:
        linear-gradient(
          145deg,
          var(
            --panel
          ),
          var(
            --panel-2
          )
        );

      box-shadow:
        0
        30px
        80px
        rgba(
          0,
          0,
          0,
          .75
        ),

        0
        0
        36px
        rgba(
          24,
          184,
          255,
          .10
        ),

        inset
        0
        0
        32px
        rgba(
          24,
          184,
          255,
          .025
        );

      overflow:
        hidden;
    }


    /* ========================================================
       EFEITO DE SCAN
    ======================================================== */

    .auth-card::before {
      content:
        "";

      position:
        absolute;

      inset:
        0;

      pointer-events:
        none;

      background:
        linear-gradient(
          110deg,
          transparent
          20%,

          rgba(
            83,
            216,
            255,
            .07
          ),

          transparent
          60%
        );

      transform:
        translateX(
          -110%
        );

      animation:
        scan
        6s
        linear
        infinite;
    }


    @keyframes scan {

      0% {
        transform:
          translateX(
            -110%
          );
      }

      55%,
      100% {
        transform:
          translateX(
            110%
          );
      }

    }


    /* ========================================================
       KICKER
    ======================================================== */

    .auth-kicker {
      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

      margin-bottom:
        14px;

      color:
        var(
          --accent-2
        );

      font-size:
        .72rem;

      font-weight:
        900;

      letter-spacing:
        2px;

      text-transform:
        uppercase;
    }


    .auth-kicker::before {
      content:
        "";

      width:
        8px;

      height:
        8px;

      border-radius:
        50%;

      background:
        var(
          --accent
        );

      box-shadow:
        0
        0
        16px
        var(
          --accent
        );
    }


    /* ========================================================
       TÍTULO
    ======================================================== */

    h1 {
      margin:
        0;

      color:
        #fff;

      font-size:
        clamp(
          2rem,
          8vw,
          3rem
        );

      line-height:
        1;

      text-transform:
        uppercase;

      text-shadow:
        0
        0
        22px
        rgba(
          24,
          184,
          255,
          .25
        );
    }


    .subtitle {
      margin:
        14px
        0
        26px;

      color:
        var(
          --text-medium
        );

      line-height:
        1.7;
    }


    /* ========================================================
       FORM
    ======================================================== */

    form {
      display:
        grid;

      gap:
        14px;
    }


    label {
      display:
        block;

      margin-bottom:
        7px;

      color:
        var(
          --text-low
        );

      font-size:
        .76rem;

      font-weight:
        900;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;
    }


    .input-wrap {
      position:
        relative;
    }


    input {
      width:
        100%;

      min-height:
        48px;

      padding:
        13px
        14px;

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .27
        );

      border-radius:
        12px;

      background:
        rgba(
          0,
          0,
          0,
          .72
        );

      color:
        #fff;

      font:
        inherit;

      outline:
        0;

      transition:
        .2s
        ease;
    }


    input:focus {
      border-color:
        var(
          --accent-2
        );

      box-shadow:
        0
        0
        0
        3px
        rgba(
          24,
          184,
          255,
          .09
        );
    }


    /* ========================================================
       SENHA
    ======================================================== */

    .password-field input {
      padding-right:
        54px;
    }


    .toggle-password {
      position:
        absolute;

      top:
        50%;

      right:
        7px;

      transform:
        translateY(
          -50%
        );

      width:
        38px;

      height:
        38px;

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .15
        );

      border-radius:
        9px;

      background:
        rgba(
          24,
          184,
          255,
          .05
        );

      color:
        var(
          --accent-2
        );

      cursor:
        pointer;
    }


    /* ========================================================
       AÇÕES
    ======================================================== */

    .actions {
      display:
        grid;

      gap:
        10px;

      margin-top:
        4px;
    }


    button,
    .secondary-link {
      min-height:
        46px;

      width:
        100%;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        10px;

      border:
        1px solid
        rgba(
          24,
          184,
          255,
          .34
        );

      font:
        inherit;

      font-weight:
        900;

      letter-spacing:
        .8px;

      text-decoration:
        none;

      cursor:
        pointer;

      transition:
        .2s
        ease;
    }


    /* ========================================================
       BOTÃO PRINCIPAL
    ======================================================== */

    .primary {
      color:
        #effbff;

      background:
        linear-gradient(
          135deg,
          #128dc5,
          #075277
        );

      box-shadow:
        0
        0
        18px
        rgba(
          24,
          184,
          255,
          .15
        );
    }


    .primary:hover:not(:disabled) {
      transform:
        translateY(
          -1px
        );

      box-shadow:
        0
        0
        26px
        rgba(
          24,
          184,
          255,
          .25
        );
    }


    /* ========================================================
       BOTÕES SECUNDÁRIOS
    ======================================================== */

    .secondary-link,
    .secondary {
      color:
        #8bdfff;

      background:
        rgba(
          24,
          184,
          255,
          .045
        );
    }


    .secondary {
      display:
        none;
    }


    .secondary.is-visible {
      display:
        inline-flex;
    }


    button:disabled {
      opacity:
        .58;

      cursor:
        wait;
    }


    /* ========================================================
       FEEDBACK
    ======================================================== */

    .feedback {
      min-height:
        24px;

      margin:
        4px
        0
        0;

      color:
        var(
          --danger
        );

      font-size:
        .88rem;

      line-height:
        1.5;

      text-align:
        center;
    }


    .feedback.ok {
      color:
        var(
          --ok
        );
    }


    /* ========================================================
       NOTA
    ======================================================== */

    .system-note {
      margin-top:
        20px;

      padding-top:
        16px;

      border-top:
        1px solid
        rgba(
          24,
          184,
          255,
          .12
        );

      color:
        var(
          --text-low
        );

      font-size:
        .75rem;

      line-height:
        1.65;

      text-align:
        center;
    }


    .system-note strong {
      color:
        var(
          --accent-2
        );
    }


    /* ========================================================
       FOCO
    ======================================================== */

    :focus-visible {
      outline:
        2px solid
        var(
          --accent-2
        );

      outline-offset:
        3px;
    }


    /* ========================================================
       CELULAR
    ======================================================== */

    @media (
      max-width:
      500px
    ) {

      body {
        padding:
          14px;
      }


      .auth-card {
        padding:
          24px
          18px;

        border-radius:
          15px;
      }

    }


    /* ========================================================
       ACESSIBILIDADE
    ======================================================== */

    @media (
      prefers-reduced-motion:
      reduce
    ) {

      *,
      *::before,
      *::after {
        animation:
          none !important;

        transition:
          none !important;
      }

    }

  </style>

</head>


<body>

  <!-- ========================================================
       PARTÍCULAS
  ========================================================= -->

  <div
    id="particles-js"
    aria-hidden="true"
  ></div>


  <!-- ========================================================
       LOGIN
  ========================================================= -->

  <main class="auth-shell">

    <section
      class="auth-card"
      aria-labelledby="login-title"
    >

      <span class="auth-kicker">
        Cyber-Nexis // Auth Gateway V9.2.1
      </span>


      <h1 id="login-title">
        Acesso Restrito
      </h1>


      <p class="subtitle">

        Autentique sua identidade.

        O acesso só é liberado após
        verificação do e-mail,
        existência do perfil no Firestore
        e checagem de bloqueio.

      </p>


      <!-- ====================================================
           FORMULÁRIO
      ===================================================== -->

      <form
        id="loginForm"
        autocomplete="on"
      >


        <!-- EMAIL -->

        <div>

          <label for="email">
            Email operacional
          </label>


          <div class="input-wrap">

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="operador@email.com"
              required
            >

          </div>

        </div>


        <!-- SENHA -->

        <div>

          <label for="senha">
            Senha
          </label>


          <div
            class="
              input-wrap
              password-field
            "
          >

            <input
              id="senha"
              name="senha"
              type="password"
              autocomplete="current-password"
              minlength="6"
              placeholder="••••••••"
              required
            >


            <button
              class="toggle-password"
              type="button"
              aria-label="Mostrar senha"
            >
              ◉
            </button>

          </div>

        </div>


        <!-- AÇÕES -->

        <div class="actions">

          <button
            id="btnLogin"
            class="primary"
            type="submit"
          >
            Entrar
          </button>


          <button
            id="btnResend"
            class="secondary"
            type="button"
          >
            Reenviar verificação
          </button>


          <a
            class="secondary-link"
            href="register.html"
          >
            Criar nova conta
          </a>

        </div>


        <!-- FEEDBACK -->

        <p
          id="feedback"
          class="feedback"
          aria-live="polite"
        ></p>


      </form>


      <!-- ====================================================
           NOTA DO SISTEMA
      ===================================================== -->

      <p class="system-note">

        <strong>
          Firebase V9.2.1:
        </strong>

        sessão persistente,
        e-mail verificado
        e perfil

        <code>
          users/{uid}
        </code>

        obrigatório.

      </p>


    </section>

  </main>


  <!-- ========================================================
       JAVASCRIPT
  ========================================================= -->

  <script type="module">

    import {
      getCurrentUser,
      login,
      resendVerification
    } from "./site.js";


    /* ========================================================
       CONFIGURAÇÃO
    ======================================================== */

    const HOME_PAGE =
      "Index.html";


    /* ========================================================
       ELEMENTOS
    ======================================================== */

    const form =
      document.getElementById(
        "loginForm"
      );


    const btnLogin =
      document.getElementById(
        "btnLogin"
      );


    const btnResend =
      document.getElementById(
        "btnResend"
      );


    const feedback =
      document.getElementById(
        "feedback"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const senhaInput =
      document.getElementById(
        "senha"
      );


    const togglePassword =
      document.querySelector(
        ".toggle-password"
      );


    /* ========================================================
       FEEDBACK
    ======================================================== */

    function setFeedback(
      message,
      type = "error"
    ) {

      feedback.textContent =
        message || "";


      feedback.classList.toggle(
        "ok",
        type === "ok"
      );

    }


    /* ========================================================
       LOADING
    ======================================================== */

    function setLoading(
      value
    ) {

      btnLogin.disabled =
        value;


      btnLogin.textContent =
        value
          ? "Verificando..."
          : "Entrar";

    }


    /* ========================================================
       TRADUÇÃO DE ERROS
    ======================================================== */

    function translateError(
      error
    ) {

      const code =
        error?.code || "";


      const messages = {

        "auth/invalid-email":
          "Email inválido.",


        "auth/invalid-credential":
          "Email ou senha incorretos.",


        "auth/user-not-found":
          "Email ou senha incorretos.",


        "auth/wrong-password":
          "Email ou senha incorretos.",


        "auth/too-many-requests":
          "Muitas tentativas. Aguarde e tente novamente.",


        "auth/network-request-failed":
          "Falha de conexão. Verifique sua internet.",


        "auth/email-not-verified":
          "Confirme o e-mail antes de entrar. Você pode reenviar a mensagem abaixo.",


        "auth/account-blocked":
          "Esta identidade está bloqueada.",


        "profile/missing":
          "Conta encontrada, mas o perfil Firestore users/{uid} não existe.",


        "app/firebase-config-missing":
          "firebase-config.js não está configurado.",


        "auth/missing-fields":
          "Informe e-mail e senha."

      };


      return (
        messages[code] ||
        error?.message ||
        "Falha ao autenticar."
      );

    }


    /* ========================================================
       BOTÃO DE REENVIO
    ======================================================== */

    function showResend(
      show
    ) {

      btnResend.classList.toggle(
        "is-visible",
        Boolean(show)
      );

    }


    /* ========================================================
       PARÂMETROS DA URL
    ======================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    /* --------------------------------------------------------
       CADASTRO CONCLUÍDO
    -------------------------------------------------------- */

    if (
      params.get(
        "registered"
      ) === "1"
    ) {

      setFeedback(
        "Conta criada. Abra o e-mail de verificação antes de entrar.",
        "ok"
      );

    }


    /* --------------------------------------------------------
       EMAIL VERIFICADO
    -------------------------------------------------------- */

    if (
      params.get(
        "verified"
      ) === "1"
    ) {

      setFeedback(
        "Verificação concluída. Agora faça login.",
        "ok"
      );

    }


    /* --------------------------------------------------------
       MOTIVO DO REDIRECT
    -------------------------------------------------------- */

    const reason =
      params.get(
        "reason"
      );


    if (
      reason ===
      "login-required"
    ) {

      setFeedback(
        "Faça login para continuar."
      );

    }


    if (
      reason ===
      "email-not-verified"
    ) {

      setFeedback(
        "Seu e-mail ainda precisa ser confirmado."
      );


      showResend(
        true
      );

    }


    if (
      reason ===
      "profile-missing"
    ) {

      setFeedback(
        "O perfil Firestore da conta não foi encontrado."
      );

    }


    if (
      reason ===
      "account-blocked"
    ) {

      setFeedback(
        "Esta identidade está bloqueada."
      );

    }


    /* ========================================================
       MOSTRAR / OCULTAR SENHA
    ======================================================== */

    togglePassword.addEventListener(
      "click",

      () => {

        const isPassword =
          senhaInput.type ===
          "password";


        senhaInput.type =
          isPassword
            ? "text"
            : "password";


        togglePassword.textContent =
          isPassword
            ? "◎"
            : "◉";


        togglePassword.setAttribute(
          "aria-label",

          isPassword
            ? "Ocultar senha"
            : "Mostrar senha"
        );

      }
    );


    /* ========================================================
       LOGIN
    ======================================================== */

    form.addEventListener(
      "submit",

      async (
        event
      ) => {

        event.preventDefault();


        const email =
          emailInput.value.trim();


        const password =
          senhaInput.value;


        showResend(
          false
        );


        try {

          setLoading(
            true
          );


          setFeedback(
            "Validando identidade...",
            "ok"
          );


          await login(
            email,
            password
          );


          setFeedback(
            "Acesso liberado. Redirecionando...",
            "ok"
          );


          window.location.replace(
            HOME_PAGE
          );


        } catch (
          error
        ) {

          console.error(
            "Erro no login:",
            error
          );


          setFeedback(
            translateError(
              error
            )
          );


          if (
            error?.code ===
            "auth/email-not-verified"
          ) {

            showResend(
              true
            );

          }


          setLoading(
            false
          );

        }

      }
    );


    /* ========================================================
       REENVIAR VERIFICAÇÃO
    ======================================================== */

    btnResend.addEventListener(
      "click",

      async () => {

        const email =
          emailInput.value.trim();


        const password =
          senhaInput.value;


        if (
          !email ||
          !password
        ) {

          setFeedback(
            "Informe e-mail e senha para reenviar a verificação."
          );

          return;
        }


        btnResend.disabled =
          true;


        btnResend.textContent =
          "Enviando...";


        try {

          await resendVerification(
            email,
            password
          );


          setFeedback(
            "Novo e-mail de verificação enviado.",
            "ok"
          );


        } catch (
          error
        ) {

          console.error(
            "Erro ao reenviar verificação:",
            error
          );


          setFeedback(
            translateError(
              error
            )
          );


        } finally {

          btnResend.disabled =
            false;


          btnResend.textContent =
            "Reenviar verificação";

        }

      }
    );


    /* ========================================================
       USUÁRIO JÁ AUTENTICADO
    ======================================================== */

    getCurrentUser(

      (
        user
      ) => {

        if (
          user
        ) {

          window.location.replace(
            HOME_PAGE
          );

        }

      }

    );

  </script>

</body>

</html>
