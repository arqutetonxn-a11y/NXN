<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Cyber-Nexis // Auth Gateway V9.2.1
  </title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          rgba(0, 255, 255, 0.08),
          transparent 40%
        ),
        #030708;

      color: #dffcff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    .container {

      width: 100%;
      max-width: 430px;

      padding: 34px;

      border:
        1px solid rgba(
          0,
          255,
          255,
          0.28
        );

      background:
        rgba(
          3,
          12,
          14,
          0.94
        );

      box-shadow:
        0 0 35px
        rgba(
          0,
          255,
          255,
          0.08
        );

      border-radius: 16px;
    }


    .logo {

      text-align: center;

      font-size: 34px;

      font-weight: 800;

      letter-spacing: 5px;

      color: #00ffff;

      text-shadow:
        0 0 8px
        rgba(
          0,
          255,
          255,
          0.8
        );

      margin-bottom: 8px;
    }


    .subtitle {

      text-align: center;

      color: #71969b;

      font-size: 11px;

      letter-spacing: 3px;

      margin-bottom: 32px;
    }


    .system {

      margin-bottom: 25px;

      padding: 12px;

      border-left:
        2px solid #00ffff;

      background:
        rgba(
          0,
          255,
          255,
          0.04
        );

      color: #75a8ad;

      font-size: 11px;

      line-height: 1.6;
    }


    label {

      display: block;

      margin-bottom: 8px;

      color: #80aeb2;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    input {

      width: 100%;

      padding: 14px 15px;

      margin-bottom: 18px;

      border:
        1px solid
        rgba(
          0,
          255,
          255,
          0.2
        );

      border-radius: 8px;

      outline: none;

      background:
        #071113;

      color: #eaffff;

      font-size: 14px;

      transition:
        0.2s ease;
    }


    input:focus {

      border-color:
        #00ffff;

      box-shadow:
        0 0 12px
        rgba(
          0,
          255,
          255,
          0.15
        );
    }


    input::placeholder {

      color: #48666a;
    }


    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 2px;

      transition:
        0.2s ease;
    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;
    }


    .primary {

      background:
        #00ffff;

      color:
        #001011;

      box-shadow:
        0 0 18px
        rgba(
          0,
          255,
          255,
          0.2
        );

      margin-bottom: 10px;
    }


    .primary:hover:not(:disabled) {

      box-shadow:
        0 0 25px
        rgba(
          0,
          255,
          255,
          0.45
        );

      transform:
        translateY(-1px);
    }


    .secondary {

      background:
        transparent;

      color:
        #00ffff;

      border:
        1px solid
        rgba(
          0,
          255,
          255,
          0.3
        );

      margin-bottom: 10px;
    }


    .secondary:hover:not(:disabled) {

      background:
        rgba(
          0,
          255,
          255,
          0.06
        );
    }


    .hidden {

      display: none;
    }


    .feedback {

      min-height: 45px;

      margin-top: 18px;

      padding: 12px;

      border-radius: 8px;

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );

      color: #9db8bb;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;
    }


    .feedback.ok {

      color:
        #00ffb7;

      border:
        1px solid
        rgba(
          0,
          255,
          183,
          0.18
        );
    }


    .register {

      display: block;

      margin-top: 24px;

      text-align: center;

      color: #607f83;

      font-size: 11px;

      text-decoration: none;

      letter-spacing: 1px;
    }


    .register:hover {

      color:
        #00ffff;
    }


    .footer {

      margin-top: 28px;

      text-align: center;

      color:
        #31494d;

      font-size: 9px;

      letter-spacing: 2px;
    }

  </style>

</head>


<body>


  <main class="container">


    <div class="logo">
      CNX
    </div>


    <div class="subtitle">
      CYBER-NEXIS // AUTH GATEWAY V9.2.1
    </div>


    <div class="system">
      SISTEMA DE AUTENTICAÇÃO ONLINE<br>
      STATUS: <strong>AGUARDANDO CREDENCIAIS</strong>
    </div>


    <!-- =====================================================
         FORMULÁRIO DE LOGIN
    ====================================================== -->

    <label for="emailInput">
      Identificação // E-mail
    </label>

    <input
      id="emailInput"
      type="email"
      autocomplete="email"
      placeholder="usuario@dominio.com"
    >


    <label for="passwordInput">
      Chave de acesso // Senha
    </label>

    <input
      id="passwordInput"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••"
    >


    <!-- ENTRAR -->

    <button
      id="btnLogin"
      class="primary"
      type="button"
    >
      ENTRAR
    </button>


    <!-- REENVIAR VERIFICAÇÃO -->

    <button
      id="btnResend"
      class="secondary hidden"
      type="button"
    >
      REENVIAR VERIFICAÇÃO
    </button>


    <!-- REDEFINIR SENHA -->

    <button
      id="btnResetPassword"
      class="secondary"
      type="button"
    >
      REDEFINIR SENHA
    </button>


    <!-- MENSAGEM -->

    <div
      id="feedback"
      class="feedback"
      aria-live="polite"
    ></div>


    <!-- CADASTRO -->

    <a
      href="cadastro.html"
      class="register"
    >
      // CRIAR NOVA CONTA
    </a>


    <div class="footer">
      CYBER-NEXIS // SECURE ACCESS NODE
    </div>


  </main>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script type="module">

    import {
      getCurrentUser,
      login,
      resendVerification,
      resetPassword
    } from "./site.js";


    // ======================================================
    // ELEMENTOS
    // ======================================================

    const emailInput =
      document.getElementById(
        "emailInput"
      );


    const passwordInput =
      document.getElementById(
        "passwordInput"
      );


    const btnLogin =
      document.getElementById(
        "btnLogin"
      );


    const btnResend =
      document.getElementById(
        "btnResend"
      );


    const btnResetPassword =
      document.getElementById(
        "btnResetPassword"
      );


    const feedback =
      document.getElementById(
        "feedback"
      );


    // ======================================================
    // FEEDBACK
    // ======================================================

    function setFeedback(
      message,
      type = ""
    ) {

      feedback.textContent =
        message;

      feedback.className =
        "feedback";

      if (type) {
        feedback.classList.add(
          type
        );
      }
    }


    // ======================================================
    // TRADUTOR DE ERROS
    // ======================================================

    function translateError(error) {

      const code =
        error?.code || "";


      const messages = {

        "auth/invalid-email":
          "O formato do e-mail é inválido.",

        "auth/invalid-credential":
          "E-mail ou senha incorretos.",

        "auth/user-not-found":
          "E-mail ou senha incorretos.",

        "auth/wrong-password":
          "E-mail ou senha incorretos.",

        "auth/too-many-requests":
          "Muitas tentativas. Aguarde alguns minutos e tente novamente.",

        "auth/network-request-failed":
          "Falha de conexão com o Firebase.",

        "auth/email-not-verified":
          "Seu e-mail ainda não foi verificado.",

        "auth/already-verified":
          "Este e-mail já foi verificado.",

        "auth/account-blocked":
          "Esta conta está bloqueada.",

        "profile/missing":
          "Perfil do usuário não encontrado.",

        "app/firebase-config-missing":
          "Configuração do Firebase ausente.",

        "auth/missing-fields":
          "Preencha e-mail e senha.",

        "auth/missing-email":
          "Informe seu e-mail.",

        "auth/missing-password":
          "Informe sua senha.",

        "auth/weak-password":
          "A senha precisa ter pelo menos 6 caracteres.",

        "auth/user-disabled":
          "Esta conta foi desativada.",

        "auth/operation-not-allowed":
          "Este método de autenticação não está habilitado no Firebase.",

        "auth/quota-exceeded":
          "Limite de solicitações atingido. Tente novamente mais tarde.",

        "auth/internal-error":
          "O Firebase encontrou um erro interno."
      };


      return (
        messages[code] ||
        error?.message ||
        "Ocorreu um erro inesperado."
      );
    }


    // ======================================================
    // LOGIN
    // ======================================================

    btnLogin.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          setFeedback(
            "Informe seu e-mail e sua senha."
          );

          return;
        }


        btnLogin.disabled = true;

        btnLogin.textContent =
          "AUTENTICANDO...";


        btnResend.classList.add(
          "hidden"
        );


        setFeedback(
          "Estabelecendo conexão segura..."
        );


        try {

          await login(
            email,
            password
          );


          setFeedback(
            "Acesso autorizado. Redirecionando...",
            "ok"
          );


          setTimeout(
            () => {
              window.location.href =
                "Index.html";
            },
            500
          );


        } catch (error) {

          console.error(
            "Erro de login:",
            error
          );


          setFeedback(
            translateError(error)
          );


          // ------------------------------------------------
          // MOSTRAR REENVIO SE E-MAIL NÃO FOI VERIFICADO
          // ------------------------------------------------

          if (
            error?.code ===
            "auth/email-not-verified"
          ) {

            btnResend.classList.remove(
              "hidden"
            );
          }


        } finally {

          btnLogin.disabled =
            false;

          btnLogin.textContent =
            "ENTRAR";
        }

      }
    );


    // ======================================================
    // REENVIAR VERIFICAÇÃO
    // ======================================================

    btnResend.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email) {

          setFeedback(
            "Informe seu e-mail."
          );

          emailInput.focus();

          return;
        }


        if (!password) {

          setFeedback(
            "Informe sua senha para reenviar a verificação."
          );

          passwordInput.focus();

          return;
        }


        btnResend.disabled =
          true;

        btnResend.textContent =
          "ENVIANDO...";


        try {

          await resendVerification(
            email,
            password
          );


          setFeedback(
            "Novo e-mail de verificação enviado. Verifique sua caixa de entrada e o Spam.",
            "ok"
          );


        } catch (error) {

          console.error(
            "Erro ao reenviar verificação:",
            error
          );


          setFeedback(
            translateError(error)
          );


        } finally {

          btnResend.disabled =
            false;

          btnResend.textContent =
            "REENVIAR VERIFICAÇÃO";
        }

      }
    );


    // ======================================================
    // REDEFINIR SENHA
    // ======================================================

    btnResetPassword.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        if (!email) {

          setFeedback(
            "Informe seu e-mail para redefinir a senha."
          );

          emailInput.focus();

          return;
        }


        btnResetPassword.disabled =
          true;

        btnResetPassword.textContent =
          "ENVIANDO...";


        try {

          await resetPassword(
            email
          );


          setFeedback(
            "E-mail de redefinição enviado. Verifique sua caixa de entrada e o Spam.",
            "ok"
          );


        } catch (error) {

          console.error(
            "Erro ao redefinir senha:",
            error
          );


          setFeedback(
            translateError(error)
          );


        } finally {

          btnResetPassword.disabled =
            false;

          btnResetPassword.textContent =
            "REDEFINIR SENHA";
        }

      }
    );


    // ======================================================
    // VERIFICAR SESSÃO EXISTENTE
    // ======================================================

    async function checkExistingSession() {

      try {

        const user =
          await getCurrentUser();


        if (!user) {
          return;
        }


        if (user.emailVerified) {

          window.location.href =
            "Index.html";
        }

      } catch (error) {

        console.error(
          "Erro ao verificar sessão:",
          error
        );
      }
    }


    checkExistingSession();


    // ======================================================
    // ENTER PARA LOGIN
    // ======================================================

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Enter"
        ) {

          btnLogin.click();
        }

      }
    );

  </script>

</body>

</html>
