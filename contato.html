<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Entre em contato com a Cyber-Nexis">
  <meta name="keywords" content="contato, Cyber-Nexis, suporte, ajuda, feedback">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Cyber-Nexis">
  <meta name="theme-color" content="#000000">

  <title>Contato - Cyber-Nexis</title>

  <link rel="stylesheet" href="Styles.css">

  <style>
    .contact-page {
      min-height: 100vh;
    }

    .contact-shell {
      width: min(1040px, calc(100% - 32px));
      margin-inline: auto;
      padding: 24px 0 58px;
      position: relative;
      z-index: 1;
    }

    .contact-header {
      display: grid;
      justify-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .contact-logo {
      width: min(260px, 72vw);
      filter:
        drop-shadow(0 0 14px rgba(24, 184, 255, 0.18))
        drop-shadow(0 0 34px rgba(24, 184, 255, 0.07));
    }

    .contact-brand {
      margin: 0;
      color: #32bfff;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      letter-spacing: 1.2px;
      text-align: center;
      text-transform: uppercase;
    }

    .contact-tagline {
      margin: 0;
      color: #7e99a8;
      text-align: center;
    }

    .contact-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      width: 100%;
    }

    .contact-nav a {
      min-height: 42px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(24, 184, 255, 0.32);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.62);
      color: #8edfff;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .contact-nav a:hover,
    .contact-nav a:focus-visible,
    .contact-nav a.active {
      color: #eef9ff;
      border-color: rgba(83, 216, 255, 0.72);
      background: rgba(24, 184, 255, 0.09);
      transform: translateY(-1px);
    }

    .contact-language {
      width: min(100%, 320px);
      min-height: 44px;
      padding: 10px 13px;
      border: 1px solid rgba(24, 184, 255, 0.24);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.82);
      color: #d9edf7;
      outline: none;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      gap: 22px;
      align-items: start;
    }

    .contact-info,
    .contact-form-card,
    .social-card {
      min-width: 0;
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid rgba(24, 184, 255, 0.26);
      border-radius: 16px;
      background:
        linear-gradient(
          145deg,
          rgba(0, 0, 0, 0.95),
          rgba(0, 0, 0, 0.89)
        );
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.56),
        inset 0 0 24px rgba(24, 184, 255, 0.012);
    }

    .contact-kicker {
      display: inline-block;
      margin-bottom: 8px;
      color: rgba(83, 216, 255, 0.72);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .contact-title {
      margin: 0 0 12px;
      color: #32bfff;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      text-transform: uppercase;
      letter-spacing: 1.1px;
    }

    .contact-info p {
      margin: 0;
      color: #b7c9d4;
      line-height: 1.72;
    }

    .contact-image {
      width: 100%;
      height: clamp(230px, 30vw, 380px);
      object-fit: cover;
      object-position: center;
      margin-top: 18px;
      border: 1px solid rgba(24, 184, 255, 0.18);
      border-radius: 12px;
      background: #000;
      box-shadow:
        0 16px 38px rgba(0, 0, 0, 0.48),
        0 0 16px rgba(24, 184, 255, 0.05);
    }

    .contact-form-title {
      margin: 0 0 20px;
      color: #5bd4ff;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .contact-form {
      display: grid;
      gap: 15px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group label {
      color: #7fcfee;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid rgba(24, 184, 255, 0.25);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.82);
      color: #eef9ff;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: rgba(83, 216, 255, 0.72);
      box-shadow: 0 0 0 3px rgba(24, 184, 255, 0.08);
    }

    .error-message {
      min-height: 18px;
      color: #ff6f86;
      font-size: 0.78rem;
    }

    .form-button {
      min-height: 48px;
      border: 1px solid rgba(83, 216, 255, 0.52);
      border-radius: 10px;
      background:
        linear-gradient(
          135deg,
          rgba(18, 141, 197, 0.95),
          rgba(7, 82, 119, 0.96)
        );
      color: #effbff;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(24, 184, 255, 0.14);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .form-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 26px rgba(24, 184, 255, 0.22);
    }

    .alert,
    #resposta {
      min-height: 24px;
      margin-top: 10px;
      padding: 0;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }

    .alert-sucesso {
      color: #5fe6bc;
      background: rgba(95, 230, 188, 0.08);
    }

    .alert-erro {
      color: #ff6f86;
      background: rgba(255, 111, 134, 0.08);
    }

    .loading {
      color: #53d8ff;
      font-weight: 800;
      animation: contact-blink 1s infinite;
    }

    @keyframes contact-blink {
      50% {
        opacity: 0.35;
      }
    }

    .honeypot {
      position: absolute !important;
      left: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .social-card {
      margin-top: 22px;
      text-align: center;
    }

    .social-card h2 {
      margin: 0 0 18px;
      color: #5bd4ff;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .image-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .image-row a {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(24, 184, 255, 0.22);
      border-radius: 12px;
      background: rgba(24, 184, 255, 0.035);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .image-row a:hover {
      transform: translateY(-2px);
      border-color: rgba(83, 216, 255, 0.62);
      background: rgba(24, 184, 255, 0.08);
    }

    .image-row img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
    }

    @media (max-width: 860px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .contact-shell {
        width: min(100% - 20px, 1040px);
        padding-top: 16px;
      }

      .contact-nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .contact-nav a {
        width: 100%;
        padding-inline: 8px;
        font-size: 0.71rem;
      }

      .contact-language {
        width: 100%;
      }

      .contact-info,
      .contact-form-card,
      .social-card {
        padding: 18px;
        border-radius: 13px;
      }

      .contact-image {
        height: min(58vw, 320px);
      }
    }

    @media (max-width: 420px) {
      .contact-image {
        height: 220px;
      }
    }

    @media (max-width: 350px) {
      .contact-nav {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading {
        animation: none;
      }
    }
  </style>
</head>

<body class="contact-page">

  <div id="particles-js" aria-hidden="true"></div>

  <main class="contact-shell">

    <header class="contact-header">
      <img
        src="Imagem/Logotipo.png"
        alt="Logotipo da Cyber-Nexis"
        class="contact-logo"
      >

      <h1 class="contact-brand">Cyber-Nexis</h1>
      <p class="contact-tagline">Protegendo a Liberdade Digital</p>

      <nav class="contact-nav" aria-label="Navegação principal">
        <a href="Index.html">Página Inicial</a>
        <a href="recrutamento.html">Recrutamento</a>
        <a href="quiz.html">Teste Quiz</a>
        <a href="contato.html" class="active" aria-current="page">Contatos</a>
        <a href="Regras.html">Regras</a>
      </nav>

      <select
        class="contact-language"
        onchange="changeLanguage(this.value)"
        aria-label="Selecionar idioma"
      >
        <option value="pt-BR">Português</option>
        <option value="en-US">English</option>
        <option value="es-ES">Español</option>
      </select>
    </header>

    <div class="contact-grid">

      <section class="contact-info">
        <span class="contact-kicker">Cyber-Nexis // Comunicação</span>

        <h2 class="contact-title">Entre em contato</h2>

        <p>
          Preencha o formulário para falar com a equipe Cyber-Nexis.
        </p>

        <img
          src="Imagem/CNX03.jpeg"
          alt="Ambiente visual da Cyber-Nexis"
          class="contact-image"
          loading="lazy"
        >
      </section>

      <section class="contact-form-card">
        <h2 class="contact-form-title">Canal de Contato</h2>

        <form id="contact-form" class="contact-form">

          <div class="form-group">
            <label for="nome">Nome</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Seu nome"
              maxlength="80"
              autocomplete="name"
              required
            >
            <span id="nome-erro" class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Seu email"
              maxlength="120"
              autocomplete="email"
              required
            >
            <span id="email-erro" class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="mensagem">Mensagem</label>
            <textarea
              id="mensagem"
              name="mensagem"
              placeholder="Sua mensagem"
              rows="6"
              maxlength="2500"
              required
            ></textarea>
            <span id="mensagem-erro" class="error-message"></span>
          </div>

          <div class="honeypot" aria-hidden="true">
            <label for="hp-field">Website</label>
            <input
              type="text"
              id="hp-field"
              name="hp-field"
              tabindex="-1"
              autocomplete="off"
            >
          </div>

          <button type="submit" class="form-button">
            Enviar Mensagem
          </button>

          <div id="resposta" aria-live="polite"></div>
        </form>
      </section>

    </div>

    <section class="social-card">
      <h2>Sinais nas Sombras Digitais</h2>

      <div class="image-row">
        <a href="#" aria-label="Facebook">
          <img src="Imagem/facebook.png" alt="">
        </a>

        <a href="#" aria-label="Twitter">
          <img src="Imagem/twitter.png" alt="">
        </a>

        <a href="#" aria-label="Instagram">
          <img src="Imagem/Instagram.jpeg" alt="">
        </a>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="contato.js"></script>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="particles-config.js"></script>

  <script>
    function changeLanguage(language) {
      document.documentElement.lang = language;
      localStorage.setItem("cyberNexisLanguage", language);
    }

    const savedLanguage = localStorage.getItem("cyberNexisLanguage");

    if (savedLanguage) {
      const select = document.querySelector(".contact-language");

      if (select) {
        select.value = savedLanguage;
      }

      document.documentElement.lang = savedLanguage;
    }
  </script>

</body>
</html>
